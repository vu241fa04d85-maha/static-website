<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slides Landing Page</title>
    <link rel="stylesheet" href="/static website.css">
</head>

<body>

    <header>
        <div class="logo">slides</div>

        <nav>
            <a href="#">Tour</a>
            <a href="#">Upgrade</a>
            <a href="#">Help</a>
            <a href="#">Explore</a>
        </nav>

        <div class="top-buttons">
            <button class="profile">Profile</button>
            <button class="app">Get app</button>
        </div>
    </header>


    <main>

        <section class="content">

            <div class="text">
                <h1>
                    Designers are meant to be<br>
                    loved, not to be understood.
                </h1>

                <p>
                    The sudden hunger, the creative leaps of mind that sees<br>
                    in a flash how to solve a problem in a simple way,<br>
                    something quite different.
                </p>

                <div class="buttons">
                    <button class="get-started">Get Started</button>
                    <button class="learn">Learn more</button>
                </div>
            </div>


            <div class="phones">

                <div class="phone phone-back">
                    <div class="screen">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80">
                    </div>
                </div>

                <div class="phone phone-front">
                    <div class="screen">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80">
                    </div>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <span>Available on iPhone</span>
        <span>⌃</span>
    </footer>

</html>
